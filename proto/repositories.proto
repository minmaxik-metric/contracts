syntax = "proto3";

package repositories.v1;

import "auth.proto";
import "google/protobuf/timestamp.proto";

service RepositoriesService {
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse);
  rpc ListRepositoriesByOrganization(ListRepositoriesByOrganizationRequest) returns (ListRepositoriesByOrganizationResponse);
  rpc GetRepositoryByProviderId(GetRepositoryByProviderIdRequest) returns (GetRepositoryByProviderIdResponse);

  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse);
}

message ListRepositoriesRequest {}

message ListRepositoriesResponse {
  repeated Repository repositories = 1;
}

message GetRepositoryRequest {
  string id = 1;
}

message GetRepositoryResponse {
  Repository repository = 1;
}

message ListRepositoriesByOrganizationRequest {
  string organization_id = 1;
}

message ListRepositoriesByOrganizationResponse {
  repeated Repository repositories = 1;
}

message GetRepositoryByProviderIdRequest {
  auth.v1.Provider provider = 1;
  int64 external_id = 2;
}

message GetRepositoryByProviderIdResponse {
  Repository repository = 1;
}

message CreateRepositoryRequest {
  string name = 1;
  optional string description = 2;
  auth.v1.Provider provider = 3;
  int64 external_id = 4;
  string url = 5;
  string organization_id = 6;
}

message CreateRepositoryResponse {
  Repository repository = 1;
}

message Repository {
  string id = 1;
  string name = 2;
  optional string description = 3;
  auth.v1.Provider provider = 4;
  int64 external_id = 5;
  string url = 6;
  string organization_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
