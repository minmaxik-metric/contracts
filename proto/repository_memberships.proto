syntax = "proto3";

package repository_memberships.v1;

service RepositoryMembershipsService {
  rpc ListRepositoryMemberships(ListRepositoryMembershipsRequest) returns (ListRepositoryMembershipsResponse);
  rpc GetRepositoryMembership(GetRepositoryMembershipRequest) returns (GetRepositoryMembershipResponse);
  rpc ListMembershipsByUser(ListMembershipsByUserRequest) returns (ListMembershipsByUserResponse);
  rpc ListMembershipsByRepository(ListMembershipsByRepositoryRequest) returns (ListMembershipsByRepositoryResponse);
  rpc GetMembershipByUserAndRepository(GetMembershipByUserAndRepositoryRequest) returns (GetMembershipByUserAndRepositoryResponse);

  rpc CreateRepositoryMembership(CreateRepositoryMembershipRequest) returns (CreateRepositoryMembershipResponse);
}

message ListRepositoryMembershipsRequest {}

message ListRepositoryMembershipsResponse {
  repeated RepositoryMembership memberships = 1;
}

message GetRepositoryMembershipRequest {
  string id = 1;
}

message GetRepositoryMembershipResponse {
  RepositoryMembership membership = 1;
}

message ListMembershipsByUserRequest {
  string user_id = 1;
}

message ListMembershipsByUserResponse {
  repeated RepositoryMembership memberships = 1;
}

message ListMembershipsByRepositoryRequest {
  string repository_id = 1;
}

message ListMembershipsByRepositoryResponse {
  repeated RepositoryMembership memberships = 1;
}

message GetMembershipByUserAndRepositoryRequest {
  string user_id = 1;
  string repository_id = 2;
}

message GetMembershipByUserAndRepositoryResponse {
  RepositoryMembership membership = 1;
}

message CreateRepositoryMembershipRequest {
  string user_id = 1;
  string repository_id = 2;
}

message CreateRepositoryMembershipResponse {
  RepositoryMembership membership = 1;
}

message RepositoryMembership {
  string id = 1;
  string user_id = 2;
  string repository_id = 3;
}
