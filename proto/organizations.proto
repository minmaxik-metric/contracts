syntax = "proto3";

package organizations.v1;

import "auth.proto";

service OrganizationsService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListOrganizationsByProvider(ListOrganizationsByProviderRequest) returns (ListOrganizationsByProviderResponse);
  rpc GetOrganizationByProviderId(GetOrganizationByProviderIdRequest) returns (GetOrganizationByProviderIdResponse);

  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
}

message ListOrganizationsRequest {}

message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}

message GetOrganizationRequest {
  string id = 1;
}

message GetOrganizationResponse {
  Organization organization = 1;
}

message ListOrganizationsByProviderRequest {
  auth.v1.Provider provider = 1;
}

message ListOrganizationsByProviderResponse {
  repeated Organization organizations = 1;
}

message GetOrganizationByProviderIdRequest {
  auth.v1.Provider provider = 1;
  string external_id = 2;
}

message GetOrganizationByProviderIdResponse {
  Organization orgranization = 1;
}

message CreateOrganizationRequest {
  auth.v1.Provider provider = 1;
  int64 external_id = 2;
  string name = 3;
  string url = 4;
  string avatar_url = 5;
}

message CreateOrganizationResponse {
  Organization organization = 1;
}

message Organization {
  string id = 1;
  auth.v1.Provider provider = 2;
  int64 external_id = 3;
  string name = 4;
  string url = 5;
  string avatar_url = 6;
}
