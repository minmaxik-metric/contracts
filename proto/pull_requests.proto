syntax = "proto3";

package pull_requests.v1;

import "auth.proto";
import "google/protobuf/timestamp.proto";

service PullRequestsService {
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse);
  rpc GetPullRequest(GetPullRequestRequest) returns (GetPullRequestResponse);
  rpc ListPullRequestsByRepository(ListPullRequestsByRepositoryRequest) returns (ListPullRequestsByRepositoryResponse);
  rpc ListPullRequestsByUser(ListPullRequestsByUserRequest) returns (ListPullRequestsByUserResponse);
  rpc ListPullRequestsByRepositoryUser(ListPullRequestsByRepositoryUserRequest) returns (ListPullRequestsByRepositoryUserResponse);

  rpc CreatePullRequest(CreatePullRequestRequest) returns (CreatePullRequestResponse);
}

message ListPullRequestsRequest {}

message ListPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
}

message GetPullRequestRequest {
  string id = 1;
}

message GetPullRequestResponse {
  PullRequest pull_request = 1;
}

message ListPullRequestsByRepositoryRequest {
  string repository_id = 1;
}

message ListPullRequestsByRepositoryResponse {
  repeated PullRequest pull_requests = 1;
}

message ListPullRequestsByUserRequest {
  string user_id = 1;
}

message ListPullRequestsByUserResponse {
  repeated PullRequest pull_requests = 1;
}

message ListPullRequestsByRepositoryUserRequest {
  string repository_id = 1;
  string user_id = 2;
}

message ListPullRequestsByRepositoryUserResponse {
  repeated PullRequest pull_requests = 1;
}

message CreatePullRequestRequest {
  string name = 1;
  optional string description = 2;
  auth.v1.Provider provider = 3;
  int64 external_id = 4;
  int32 number = 5;
  PullRequestState state = 6;
  string repository_id = 7;
  string author_id = 8;
  int32 additions = 9;
  int32 deletions = 10;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp merged_at = 12;
  optional google.protobuf.Timestamp closed_at = 13;
}

message CreatePullRequestResponse {
  PullRequest pull_request = 1;
}

message PullRequest {
  string id = 1;
  string name = 2;
  optional string description = 3;
  auth.v1.Provider provider = 4;
  int64 external_id = 5;
  int32 number = 6;
  PullRequestState state = 7;
  string repository_id = 8;
  string author_id = 9;
  int32 additions = 10;
  int32 deletions = 11;
  google.protobuf.Timestamp created_at = 12;
  optional google.protobuf.Timestamp merged_at = 13;
  optional google.protobuf.Timestamp closed_at = 14;
}

enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_MERGED = 2;
  PULL_REQUEST_STATE_CLOSED = 3;
}
