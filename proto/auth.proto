syntax = "proto3";

package auth.v1;

import "account.proto";

service AuthService {
  rpc GithubLogin(GithubLoginRequest) returns (GithubLoginResponse);

  rpc ValidateJwt(ValidateJwtRequest) returns (ValidateJwtResponse);

  rpc Refresh(RefreshRequest) returns (RefreshResponse);
}

message GithubLoginRequest {
  Provider provider = 1;
  string provider_id = 2;
  string username = 3;
  string profile_url = 4;
  string avatar_url = 5;
  account.v1.Role role = 6;
}

message GithubLoginResponse {
  TokenPair tokens = 1;
}

message ValidateJwtRequest {
  string access_token = 1;
}

message ValidateJwtResponse {
  bool valid = 1;
  oneof account {
    string account_id = 2;
  }
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  TokenPair tokens = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
}

enum Provider {
  PROVIDER_UNSPECIFIED = 0;
  PROVIDER_GITHUB = 1;
}
